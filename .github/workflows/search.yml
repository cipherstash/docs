name: Docs search

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_POSTHOG_KEY: phc_search_test
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run test:search
      - run: bun run build
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Verify production search
        run: |
          bunx --no-install next start -p 3001 > /tmp/search-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3001/docs/api/search?query=ready > /dev/null; then
              break
            fi
            sleep 1
          done
          bun run validate-search
          SEARCH_ANALYTICS_TEST=1 bun run test:search:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: search-failures
          path: |
            test-results/
            /tmp/search-server.log
